<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Advanced WA Controller</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>WhatsApp Control</h1>

    <section class="card" id="connectCard">
      <h2>Connect Device</h2>
      <button id="startSession">Start Session</button>
      <input id="sessionId" placeholder="Session ID (optional)" />
      <input id="phoneNumber" placeholder="Pair phone number (e.g. 919876543210)" />
      <button id="pairCode">Get Pairing Code</button>
      <p id="status">Idle</p>
      <img id="qr" alt="QR" />
      <p id="pair"></p>
    </section>

    <section class="card hidden" id="chatCard">
      <h2>Chat</h2>
      <input id="target" placeholder="Number or JID (e.g. 919876543210 or 919876543210@s.whatsapp.net)" />
      <textarea id="payload" rows="5" placeholder="Type message"></textarea>
      <button id="send">Send</button>
    </section>

    <section class="card">
      <h2>Recent messages</h2>
      <pre id="logs"></pre>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
