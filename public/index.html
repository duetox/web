<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>WA Web Clone</title><link rel='stylesheet' href='styles.css'/></head>
<body>
<div class='layout'>
  <aside class='sidebar'>
    <h1>WhatsApp Web Clone</h1>
    <button id='newAccount'>Add New Account</button>
    <button id='logout'>Logout</button>
    <input id='search' placeholder='Search chats'/>
    <pre id='accounts'></pre>
  </aside>
  <main class='main'>
    <section class='card' id='loginView'>
      <h2>Login</h2><input id='username' placeholder='Username'/><input id='password' type='password' placeholder='Password'/><button id='login'>Login</button>
      <p class='hint'>First time? click Add New Account.</p>
    </section>
    <section class='card hidden' id='onboardingView'>
      <h2>First-time WhatsApp Link</h2>
      <p id='creds'></p><input id='phoneNumber' placeholder='Phone Number for pairing code'/><button id='pairCode'>Get Pairing Code</button><p id='pair'></p><img id='qr'/>
    </section>
    <section class='card hidden' id='chatView'>
      <h2 id='status'>Connected</h2>
      <input id='jid' placeholder='JID or number'/>
      <select id='payloadType'><option value='text'>Text</option><option value='image'>Image URL</option><option value='video'>Video URL</option><option value='document'>Document URL</option></select>
      <textarea id='message' placeholder='Type text or caption'></textarea>
      <input id='mediaUrl' placeholder='https://... (required for media)'/>
      <button id='send'>Send</button>
      <h3>Add Commands</h3>
      <input id='commandName' placeholder='.intro'/><select id='commandType'><option value='text'>Text reply</option><option value='image'>Image reply</option></select>
      <textarea id='commandBody' placeholder='Reply text'></textarea><input id='commandMediaUrl' placeholder='Image URL (for image reply)'/>
      <button id='saveCommand'>Save Command</button><pre id='commandsList'></pre>
      <h3>Events</h3><pre id='events'></pre>
    </section>
  </main>
</div>
<script src='/socket.io/socket.io.js'></script><script src='app.js'></script>
</body></html>
